workflows:
  ios-unsigned-ipa:
    name: Build 3105 unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build iOS app without code signing
        script: |
          set -e
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/DerivedData/Build/Products/Release-iphoneos/3105.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find "$CM_BUILD_DIR/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo 'ERROR: App bundle was not produced by xcodebuild.' >&2
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          zip -qry "$CM_BUILD_DIR/3105-unsigned.ipa" Payload
    artifacts:
      - 3105-unsigned.ipa
      - "**/build/*.log"
